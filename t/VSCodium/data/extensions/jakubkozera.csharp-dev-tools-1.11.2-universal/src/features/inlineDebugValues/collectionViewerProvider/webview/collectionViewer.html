<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cssUri}} 'unsafe-inline'; script-src {{jsUri}} 'unsafe-inline';">
    <title>Collection Viewer</title>
    <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1 id="title">Collection Viewer</h1>
                <div class="stats">
                    <span id="itemCount">0 items</span>
                    <span id="filteredCount" style="display: none;"></span>
                </div>
            </div>
            <div class="controls">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search all columns..." />
                </div>
                <button id="exportBtn" class="btn">
                    Export CSV
                </button>
                <button id="refreshBtn" class="btn">
                    Refresh
                </button>
            </div>
        </div>
        
        <!-- Data Table Container -->
        <div id="tableContainer" class="table-container">
            <table id="dataTable" class="data-table">
                <thead id="tableHead">
                    <!-- Headers will be generated dynamically -->
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be generated dynamically -->
                </tbody>
            </table>
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">No Data</div>
            <h2>No Data Available</h2>
            <p>The collection is empty or contains no displayable items.</p>
        </div>
        
        <!-- Column Filter Modal -->
        <div id="columnFilterModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="filterModalTitle">Filter Column</h3>
                    <button id="closeFilterModal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <!-- Filter Type Selection -->
                    <div class="filter-type-selection">
                        <label>
                            <input type="radio" name="filterType" value="values" checked />
                            <span>Filter by Values</span>
                        </label>
                        <label>
                            <input type="radio" name="filterType" value="conditions" />
                            <span>Filter by Conditions</span>
                        </label>
                    </div>
                    
                    <!-- Values Filter (Original) -->
                    <div id="valuesFilter" class="filter-section">
                        <div class="filter-search">
                            <input type="text" id="filterSearch" placeholder="Search values..." />
                        </div>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" id="selectAll" checked />
                                <span>(Select All)</span>
                            </label>
                            <div id="filterValues" class="filter-values">
                                <!-- Filter values will be populated here -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- Conditions Filter (New Advanced) -->
                    <div id="conditionsFilter" class="filter-section" style="display: none;">
                        <div class="conditions-header">
                            <label>Logic Operator:</label>
                            <select id="logicOperator" class="logic-operator">
                                <option value="AND">AND (All conditions must match)</option>
                                <option value="OR">OR (Any condition can match)</option>
                            </select>
                        </div>
                        
                        <div id="filterConditions" class="filter-conditions">
                            <!-- Conditions will be added here -->
                        </div>
                        
                        <button id="addCondition" class="btn btn-secondary">Add Condition</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="applyFilter" class="btn btn-primary">Apply</button>
                    <button id="clearFilter" class="btn btn-secondary">Clear</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{jsUri}}"></script>
</body>
</html>
