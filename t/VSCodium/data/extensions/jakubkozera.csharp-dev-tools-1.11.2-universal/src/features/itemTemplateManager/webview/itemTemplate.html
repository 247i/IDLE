<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Item</title>
    <link href="${stylesUri}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Add New Item</h1>
                <p>Select a template to create a new item</p>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="searchBox" class="search-input" placeholder="Search templates..." />
                        <svg class="search-icon" viewBox="0 0 24 24">
                            <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L20.71,20L19.29,21.41L13.03,15.14C11.88,15.88 10.5,16.5 9.5,16.5A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                        </svg>
                    </div>
                </div>
                <ul id="templateList">
                    <!-- Templates will be populated here -->
                </ul>
            </div>
            
            <div class="templates-panel">
                <div id="templateDetails" class="form-panel hidden">
                    <div class="form-content">
                        <div class="project-info-section">
                            <h2 id="templateName" style="margin-top: 0;"></h2>
                            <p id="templateDescription" style="color: var(--vscode-descriptionForeground); margin-bottom: 20px;"></p>
                            
                            <div class="form-group" id="nameContainer">
                                <label for="itemName">Name *</label>
                                <input type="text" id="itemName" placeholder="Enter item name" />
                            </div>
                        </div>

                        <div id="parametersContainer">
                            <!-- Parameters will be populated here -->
                        </div>
                    </div>

                    <div class="buttons">
                        <button id="cancelBtn" class="secondary">Cancel</button>
                        <button id="createBtn" class="primary">Add Item</button>
                    </div>
                </div>
                
                <div id="recentItemsContainer" class="recent-items-container hidden">
                    <!-- Recent items will be populated here -->
                </div>
                
                <div id="emptyState" class="empty-state">
                    <div class="empty-state-icon">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="45"
                          height="45"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="M4 4m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z" />
                          <path d="M4 12m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
                          <path d="M14 12l6 0" />
                          <path d="M14 16l6 0" />
                          <path d="M14 20l6 0" />
                        </svg>
                    </div>
                    <div class="empty-state-title">No template selected</div>
                    <div class="empty-state-description">Select an item template from the left sidebar to configure and create it.</div>
                </div>
            </div>
        </div>
    </div>
    <script src="${scriptUri}"></script>
</body>
</html>
