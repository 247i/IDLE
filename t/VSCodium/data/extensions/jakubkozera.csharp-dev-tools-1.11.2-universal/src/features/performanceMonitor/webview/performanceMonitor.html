<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            padding: 0 !important;
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            margin: 0 !important;
        }
        
        .charts-container {
            display: flex;
            flex-direction: column;
        }
        
        .chart-container {
            background-color: var(--vscode-sideBar-background);
            padding: 8px;
            border-bottom: 1px solid var(--vscode-sideBar-border);
            min-height: 180px;
        }
        
        .chart-title {
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.0em;
            color: var(--vscode-foreground);
        }
        
        canvas {
            max-height: 180px !important;
            height: 180px !important;
        }
        
        .no-data {
            text-align: center;
            color: var(--vscode-descriptionForeground);
            padding: 60px 20px;
            font-style: italic;
            background-color: var(--vscode-sideBar-background);
            border-bottom: 1px solid var(--vscode-sideBar-border);
        }
    </style>
    </style>
</head>
<body>
    <div id="noData" class="no-data">
        No monitoring session active. Start debugging or running a project to see performance metrics.
    </div>
    
    <div id="chartsContainer" class="charts-container" style="display: none;">
        <div class="chart-container">
            <div class="chart-title" id="cpuTitle">CPU Usage (%)</div>
            <canvas id="cpuChart"></canvas>
        </div>
        
        <div class="chart-container">
            <div class="chart-title" id="memoryTitle">Memory Usage (MB)</div>
            <canvas id="memoryChart"></canvas>
        </div>
    </div>

    <script>
        console.log('=== PERFORMANCE MONITOR WEBVIEW LOADING ===');
        
        const vscode = acquireVsCodeApi();
        console.log('VS Code API acquired:', !!vscode);
        
        let cpuChart = null;
        let memoryChart = null;
        let isInitialized = false;
        
        // Chart configuration
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                intersect: false,
                mode: 'index'
            },
            animation: {
                duration: 0 // Disable animation for real-time updates
            },
            scales: {
                x: {
                    type: 'linear',
                    position: 'bottom',
                    min: 0,
                    max: 60, // Show last 60 seconds
                    ticks: {
                        display: false // Ukryj wszystkie etykiety na osi X
                    },
                    grid: {
                        color: 'rgba(204, 204, 204, 0.1)',
                        lineWidth: 1
                    },
                    title: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: true,
                    ticks: {
                        color: 'rgba(204, 204, 204, 0.8)',
                        callback: function(value, index, ticks) {
                            // Pokaż tylko ostatnią (najwyższą) wartość
                            if (index === ticks.length - 1) {
                                return value;
                            }
                            return '';
                        }
                    },
                    grid: {
                        color: 'rgba(204, 204, 204, 0.1)',
                        lineWidth: 1
                    },
                    title: {
                        display: false
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleColor: 'white',
                    bodyColor: 'white',
                    borderColor: 'rgba(204, 204, 204, 0.3)',
                    borderWidth: 1,
                    displayColors: false,
                    callbacks: {
                        title: function() {
                            return ''; // Ukryj tytuł (czas)
                        },
                        label: function(context) {
                            return context.parsed.y.toFixed(1) + (context.datasetIndex === 0 ? '%' : ' MB');
                        }
                    }
                }
            },
            elements: {
                point: {
                    radius: 0, // Ukryj punkty na linii
                    hoverRadius: 6, // Większy punkt przy hover
                    hitRadius: 10 // Większy obszar do kliknięcia
                },
                line: {
                    borderWidth: 2,
                    tension: 0.4 // Więcej gładkości dla linii
                }
            }
        };
        
        function initializeCharts() {
            console.log('=== INITIALIZING CHARTS ===');
            console.log('isInitialized:', isInitialized);
            console.log('Chart.js available:', typeof Chart !== 'undefined');
            
            if (isInitialized) return;
            
            const cpuCtx = document.getElementById('cpuChart').getContext('2d');
            const memoryCtx = document.getElementById('memoryChart').getContext('2d');
            
            cpuChart = new Chart(cpuCtx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'CPU Usage (%)',
                        data: [],
                        borderColor: '#ff4757',
                        backgroundColor: 'rgba(255, 71, 87, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHitRadius: 10
                    }]
                },
                options: {
                    ...chartOptions,
                    scales: {
                        ...chartOptions.scales,
                        y: {
                            ...chartOptions.scales.y,
                            max: 100,
                            ticks: {
                                ...chartOptions.scales.y.ticks,
                                callback: function(value, index, ticks) {
                                    // Pokaż tylko ostatnią (najwyższą) wartość
                                    if (index === ticks.length - 1) {
                                        return value + '%';
                                    }
                                    return '';
                                }
                            },
                            title: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        ...chartOptions.plugins,
                        tooltip: {
                            ...chartOptions.plugins.tooltip,
                            callbacks: {
                                title: function() {
                                    return ''; // Ukryj tytuł (czas)
                                },
                                label: function(context) {
                                    return context.parsed.y.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
            
            memoryChart = new Chart(memoryCtx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Working Set (MB)',
                            data: [],
                            borderColor: '#3742fa',
                            backgroundColor: 'rgba(55, 66, 250, 0.1)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHitRadius: 10
                        },
                        {
                            label: 'Private Memory (MB)',
                            data: [],
                            borderColor: '#2ed573',
                            backgroundColor: 'rgba(46, 213, 115, 0.1)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHitRadius: 10
                        }
                    ]
                },
                options: {
                    ...chartOptions,
                    scales: {
                        ...chartOptions.scales,
                        y: {
                            ...chartOptions.scales.y,
                            ticks: {
                                ...chartOptions.scales.y.ticks,
                                callback: function(value, index, ticks) {
                                    // Pokaż tylko ostatnią (najwyższą) wartość
                                    if (index === ticks.length - 1) {
                                        return Math.round(value) + ' MB';
                                    }
                                    return '';
                                }
                            },
                            title: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        ...chartOptions.plugins,
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                color: 'rgba(204, 204, 204, 0.8)',
                                usePointStyle: true,
                                padding: 15
                            }
                        },
                        tooltip: {
                            ...chartOptions.plugins.tooltip,
                            callbacks: {
                                title: function() {
                                    return ''; // Ukryj tytuł (czas)
                                },
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    return label + ': ' + context.parsed.y.toFixed(1) + ' MB';
                                }
                            }
                        }
                    }
                }
            });
            
            isInitialized = true;
        }
        
        function updateUI(sessionActive, processInfo = null) {
            console.log('updateUI called with sessionActive:', sessionActive, 'processInfo:', processInfo);
            
            const noDataEl = document.getElementById('noData');
            const chartsEl = document.getElementById('chartsContainer');
            
            if (sessionActive) {
                console.log('Setting UI to active state');
                noDataEl.style.display = 'none';
                chartsEl.style.display = 'flex';
                
                if (!isInitialized) {
                    console.log('Initializing charts for first time');
                    initializeCharts();
                }
            } else {
                console.log('Setting UI to inactive state');
                noDataEl.style.display = 'block';
                chartsEl.style.display = 'none';
            }
        }
        
        let sessionStartTime = null;
        
        function addMetricsData(metrics) {
            console.log('addMetricsData called with metrics:', metrics);
            
            if (!isInitialized || !cpuChart || !memoryChart) {
                console.log('Charts not initialized yet, initializing now...');
                initializeCharts();
                if (!isInitialized) {
                    console.error('Failed to initialize charts');
                    return;
                }
            }
            
            // If we have timeSeries data, use it; otherwise fall back to single point
            if (metrics.timeSeries && metrics.timeSeries.length > 0) {
                console.log('Using timeSeries data with', metrics.timeSeries.length, 'points');
                updateChartsWithTimeSeries(metrics.timeSeries);
            } else {
                console.log('Using single point data');
                updateChartsWithSinglePoint(metrics);
            }
        }
        
        function updateChartsWithTimeSeries(timeSeries) {
            console.log('updateChartsWithTimeSeries called with', timeSeries.length, 'data points');
            
            if (!sessionStartTime) {
                sessionStartTime = new Date(timeSeries[0].timestamp);
            }
            
            // Convert timeSeries to chart data points
            const cpuData = [];
            const workingSetData = [];
            const privateMemoryData = [];
            
            const now = Date.now();
            
            timeSeries.forEach(point => {
                const pointTime = new Date(point.timestamp);
                const secondsAgo = Math.max(0, (now - pointTime.getTime()) / 1000);
                
                // Only include points from the last 60 seconds
                if (secondsAgo <= 60) {
                    const x = 60 - secondsAgo; // Show as time from left (0) to right (60)
                    
                    cpuData.push({
                        x: x,
                        y: point.cpuUsagePercent || 0
                    });
                    
                    workingSetData.push({
                        x: x,
                        y: point.workingSetMB || point.memoryUsageMB || 0
                    });
                    
                    privateMemoryData.push({
                        x: x,
                        y: point.privateMemoryMB || 0
                    });
                }
            });
            
            console.log('Generated chart data - CPU points:', cpuData.length, 'Memory points:', workingSetData.length);
            
            // Update chart data
            cpuChart.data.datasets[0].data = cpuData;
            memoryChart.data.datasets[0].data = workingSetData;
            memoryChart.data.datasets[1].data = privateMemoryData;
            
            // Update chart titles with current values
            if (cpuData.length > 0) {
                const currentCpu = cpuData[cpuData.length - 1].y;
                document.getElementById('cpuTitle').textContent = `CPU Usage (%) - ${currentCpu.toFixed(1)}%`;
            }
            
            if (workingSetData.length > 0) {
                const currentMemory = workingSetData[workingSetData.length - 1].y;
                document.getElementById('memoryTitle').textContent = `Memory Usage (MB) - ${currentMemory.toFixed(1)} MB`;
            }
            
            // Update charts
            cpuChart.update('none');
            memoryChart.update('none');
            console.log('Charts updated with timeSeries data');
        }
        
        function updateChartsWithSinglePoint(metrics) {
            console.log('updateChartsWithSinglePoint called with CPU:', metrics.cpuUsagePercent, 'Memory:', metrics.memoryUsageMB);
            
            if (!sessionStartTime) {
                sessionStartTime = new Date(metrics.timestamp);
            }
            
            const currentTime = new Date(metrics.timestamp);
            const secondsElapsed = (currentTime - sessionStartTime) / 1000;
            
            // Add data points
            cpuChart.data.datasets[0].data.push({
                x: secondsElapsed,
                y: metrics.cpuUsagePercent || 0
            });
            
            memoryChart.data.datasets[0].data.push({
                x: secondsElapsed,
                y: metrics.workingSetMB || metrics.memoryUsageMB || 0
            });
            
            memoryChart.data.datasets[1].data.push({
                x: secondsElapsed,
                y: metrics.privateMemoryMB || 0
            });
            
            // Keep only last 60 seconds of data
            const cutoffTime = secondsElapsed - 60;
            
            cpuChart.data.datasets[0].data = cpuChart.data.datasets[0].data.filter(point => point.x > cutoffTime);
            memoryChart.data.datasets[0].data = memoryChart.data.datasets[0].data.filter(point => point.x > cutoffTime);
            memoryChart.data.datasets[1].data = memoryChart.data.datasets[1].data.filter(point => point.x > cutoffTime);
            
            // Update chart x-axis range to show the last 60 seconds
            const maxTime = Math.max(60, secondsElapsed);
            const minTime = maxTime - 60;
            
            cpuChart.options.scales.x.min = minTime;
            cpuChart.options.scales.x.max = maxTime;
            memoryChart.options.scales.x.min = minTime;
            memoryChart.options.scales.x.max = maxTime;
            
            // Update chart titles with current values
            const currentCpu = metrics.cpuUsagePercent || 0;
            const currentMemory = metrics.workingSetMB || metrics.memoryUsageMB || 0;
            
            document.getElementById('cpuTitle').textContent = `CPU Usage (%) - ${currentCpu.toFixed(1)}%`;
            document.getElementById('memoryTitle').textContent = `Memory Usage (MB) - ${currentMemory.toFixed(1)} MB`;
            
            // Update charts
            cpuChart.update('none');
            memoryChart.update('none');
            console.log('Charts updated with single point data');
        }
        
        function clearCharts() {
            console.log('clearCharts called');
            if (!isInitialized) return;
            
            sessionStartTime = null;
            
            if (cpuChart) {
                cpuChart.data.datasets[0].data = [];
                cpuChart.update();
            }
            
            if (memoryChart) {
                memoryChart.data.datasets[0].data = [];
                memoryChart.data.datasets[1].data = [];
                memoryChart.update();
            }
        }
        
        // Listen for messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;
            console.log('Webview received message:', message);
            
            switch (message.type) {
                case 'sessionStart':
                    console.log('Starting monitoring session:', message.data);
                    clearCharts();
                    updateUI(true, message.data);
                    break;
                    
                case 'sessionEnd':
                    console.log('Ending monitoring session');
                    updateUI(false);
                    break;
                    
                case 'metrics':
                    console.log('Received metrics:', message.data);
                    addMetricsData(message.data);
                    break;
                    
                case 'error':
                    console.error('Performance monitor error:', message.data);
                    break;
            }
        });
        
        // Send ready message to extension
        console.log('Webview ready, sending ready message to extension');
        vscode.postMessage({ type: 'ready' });
        
        // Initial state
        updateUI(false);
        console.log('=== PERFORMANCE MONITOR WEBVIEW FULLY LOADED ===');
    </script>
</body>
</html>
