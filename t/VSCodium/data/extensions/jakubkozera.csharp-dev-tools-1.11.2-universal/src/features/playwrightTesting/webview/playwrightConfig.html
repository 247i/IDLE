<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src vscode-resource: 'unsafe-inline'; script-src vscode-resource: 'unsafe-inline'; img-src vscode-resource: data:;">
    <title>Playwright Configuration</title>
    <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
    <div class="container">
        <!-- Override section - only shown when .runsettings files are detected -->
        <div class="override-section" id="overrideSection" style="display: none;">
            <div class="checkbox-item">
                <input type="checkbox" id="overrideRunSettingsCheckbox" class="checkbox">
                <label for="overrideRunSettingsCheckbox" class="checkbox-label">Override .runsettings</label>
            </div>
            <div class="override-description" id="overrideDescription">
                Use custom Playwright settings instead of detected .runsettings file
            </div>
        </div>
        
        <!-- Playwright settings - shown when no .runsettings OR when override is enabled -->
        <div class="playwright-settings" id="playwrightSettings">
            <div class="checkbox-item">
                <input type="checkbox" id="showBrowserCheckbox" class="checkbox">
                <label for="showBrowserCheckbox" class="checkbox-label">Show Browser Window</label>
            </div>
            
            <div class="checkbox-item">
                <input type="checkbox" id="enableDebuggerCheckbox" class="checkbox">
                <label for="enableDebuggerCheckbox" class="checkbox-label">Enable Playwright Debugger</label>
            </div>
            
            <div class="checkbox-item">
                <input type="checkbox" id="slowModeCheckbox" class="checkbox">
                <label for="slowModeCheckbox" class="checkbox-label">Enable Slow Mode</label>
            </div>
        </div>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>
