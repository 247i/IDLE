<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Reference Manager - {{projectName}}</title>
    <link href="{{cssUri}}" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Project References</h1>
            <div class="project-info">
                <span class="project-name">{{projectName}}</span>
                <span class="project-path">{{projectPath}}</span>
            </div>
        </div>

        <div class="content">
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Search projects..." />
            </div>

            <div class="projects-section">
                <div class="section-header">
                    <h2>Available Projects</h2>
                    <div class="bulk-actions">
                        <button id="selectAllBtn" class="btn-secondary">Select All</button>
                        <button id="deselectAllBtn" class="btn-secondary">Deselect All</button>
                    </div>
                </div>

                <div id="projectsList" class="projects-list">
                    <div class="loading">Loading projects...</div>
                </div>
            </div>
            <div class="actions-section">
                <button id="saveBtn" class="btn-primary">Save Changes</button>
                <button id="resetBtn" class="btn-secondary" style="display: none;">Reset</button>
                <button id="cancelBtn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-message">Processing changes...</p>
        </div>
    </div>

    <script src="{{jsUri}}"></script>
</body>

</html>
