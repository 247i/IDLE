<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Pull Request</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline' https://unpkg.com; script-src {{cspSource}} 'unsafe-inline' https://unpkg.com; font-src {{cspSource}} https://unpkg.com; connect-src https://unpkg.com;">
    <link rel="stylesheet" href="{{cssPath}}">
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <style>
        /* Custom styling for the pull request form */
        .form-section-compact .tag-input-container {
            padding: 0;
            border: 1px solid var(--vscode-input-border);
        }
        
        .form-section-compact .tag-input {
            border: none;
            padding: 4px 8px;
        }
        
        /* Fix for branch selector scrolling and width */
        .branch-dropdown {
            min-width: 300px; /* Wider dropdown to prevent line breaks */
            flex-grow: 1;
        }
        
        .branch-list {
            padding-right: 0;
        }
        
        .branch-option {
            padding-left: 12px;
        }
        
        .branch-section-title {
            color: var(--vscode-descriptionForeground);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            padding: 6px 12px 4px;
            border-top: 1px solid var(--vscode-widget-shadow);
        }
        
        /* First section shouldn't have border */
        .branch-list > .branch-section:first-child .branch-section-title {
            border-top: none;
        }
        
        /* Fix for dropdown arrow animation */
        .branch-button.active .dropdown-arrow {
            transform: rotate(180deg);
        }

        /* Global overlay spinner styles */
        .overlay-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            backdrop-filter: blur(2px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay-spinner.show {
            display: flex;
            opacity: 1;
        }

        .overlay-spinner.hidden {
            opacity: 0;
        }

        .overlay-spinner-content {
            text-align: center;
            background-color: var(--vscode-editor-background);
            padding: 30px 40px;
            border-radius: 8px;
            border: 1px solid var(--vscode-panel-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .overlay-spinner-icon {
            width: 40px;
            height: 40px;
            border: 3px solid var(--vscode-panel-border);
            border-top: 3px solid var(--vscode-button-background);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .overlay-spinner-title {
            color: var(--vscode-foreground);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .overlay-spinner-text {
            color: var(--vscode-descriptionForeground);
            font-size: 14px;
            line-height: 1.4;
        }

        /* Loading spinner for inline content */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--vscode-descriptionForeground);
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            border: 2px solid var(--vscode-panel-border);
            border-top: 2px solid var(--vscode-button-background);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        .loading-text {
            margin-top: 8px;
            font-weight: 500;
            color: var(--vscode-foreground);
            font-size: 14px;
        }

        .loading-subtext {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.8;
            color: var(--vscode-descriptionForeground);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with branch selector -->
        <div class="header">
            <div class="branch-selector">
                <div class="branch-dropdown" data-side="source">
                    <button class="branch-button" id="sourceBranch">
                        <svg class="branch-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.5 2.5 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5zM3.5 3.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0z"/>
                        </svg>
                        <span class="branch-name">Select source branch...</span>
                        <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M6 9l6 6l6 -6" />
                        </svg>
                    </button>
                    <div class="dropdown-menu" style="left: 0">
                        <input type="text" class="filter-input" placeholder="Filter branches...">
                        <div class="branch-list" id="sourceBranchList">
                            <!-- Branch options will be populated here -->
                        </div>
                    </div>
                </div>

                <span class="into-text">into</span>

                <div class="branch-dropdown" data-side="target">
                    <button class="branch-button" id="targetBranch">
                        <svg class="branch-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                            <path d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.5 2.5 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5zM3.5 3.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0z"/>
                        </svg>
                        <span class="branch-name">Select target branch...</span>
                        <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M6 9l6 6l6 -6" />
                        </svg>
                    </button>
                    <div class="dropdown-menu" >
                        <input type="text" class="filter-input" placeholder="Filter branches...">
                        <div class="branch-list" id="targetBranchList">
                            <!-- Branch options will be populated here -->
                        </div>
                    </div>
                </div>

                <button type="submit" form="pullRequestForm" class="btn btn-primary" id="createButton">
                    Create
                </button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-button active" data-tab="overview" onclick="switchTab('overview')">
                Overview
            </button>
            <button class="tab-button" data-tab="files" onclick="switchTab('files')" id="filesTabButton">
                <span class="tab-text">Files</span>
                <span class="tab-badge" id="filesBadge" style="display: none;"></span>
            </button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-contents">
            <!-- Overview Tab -->
            <div id="overviewTab" class="tab-content active">
                <form id="pullRequestForm" onsubmit="createPullRequest(event)">
                    <!-- Basic Information -->
                    <div class="form-section">
                        <h3>Basic Information</h3>
                        <div class="form-group">
                            <label for="title">Title *</label>
                            <input type="text" id="title" placeholder="Enter pull request title" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" rows="6" placeholder="Describe your changes..."></textarea>
                        </div>
                    </div>

                    <!-- Reviewers & Assignees -->
                    <div class="form-section form-section-compact" style="display: none;">
                        <h3>People</h3>
                        <div class="form-row">
                            <div class="form-group form-group-compact">
                                <label for="reviewersInput">Reviewers</label>
                                <div class="tag-input-container" id="reviewersInput">
                                    <input type="text" class="tag-input" placeholder="Add reviewer..." onkeydown="handleTagInput(event, 'reviewers')">
                                </div>
                            </div>
                            
                            <div class="form-group form-group-compact">
                                <label for="assigneesInput">Assignees</label>
                                <div class="tag-input-container" id="assigneesInput">
                                    <input type="text" class="tag-input" placeholder="Add assignee..." onkeydown="handleTagInput(event, 'assignees')">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Labels & Work Items -->
                    <div class="form-section form-section-compact" style="display: none;">
                        <h3>Organization</h3>
                        <div class="form-row">
                            <div class="form-group form-group-compact">
                                <label for="labelsInput">Labels</label>
                                <div class="tag-input-container" id="labelsInput">
                                    <input type="text" class="tag-input" placeholder="Add label..." onkeydown="handleTagInput(event, 'labels')">
                                </div>
                            </div>
                            
                            <div class="form-group form-group-compact">
                                <label for="workItemsInput">Work Items</label>
                                <div class="tag-input-container" id="workItemsInput">
                                    <input type="text" class="tag-input" placeholder="Add work item..." onkeydown="handleTagInput(event, 'workItems')">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Files Tab -->
            <div id="filesTab" class="tab-content">
                <div class="files-layout">
                    <div class="files-sidebar" id="filesSidebar">
                        <div class="files-header">

                            <h4>Changed Files</h4>
                        </div>
                        <div id="fileList" class="file-list">
                            <div class="form-help">Select branches to view changes</div>
                        </div>
                    </div>
                    <div class="files-content">
                        <div class="diff-header-placeholder">
                            <div class="diff-view-controls">

                            </div>
                        </div>
                        <div id="diffPreview" class="diff-preview">
                            <div class="form-help">Select a file to view changes</div>
                            <div id="diffContainer" class="diff-container" data-view-mode="unified">
                                <!-- Monaco Editor will be initialized here -->
                                <div id="monacoEditor" class="monaco-editor-container"></div>
                                <!-- Fallback for custom diff view if Monaco fails -->
                                <div id="customDiffView" class="custom-diff-view" style="display: none;">
                                    <div class="diff-content-wrapper">
                                        <div id="leftSide" class="diff-side diff-side-left"></div>
                                        <div id="rightSide" class="diff-side diff-side-right"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="{{jsPath}}"></script>
</body>
</html>
