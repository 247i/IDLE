<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull Request - Azure DevOps</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline' https://unpkg.com; script-src {{cspSource}} 'unsafe-inline' https://unpkg.com; worker-src {{cspSource}} blob: https://unpkg.com; font-src {{cspSource}} https://unpkg.com; connect-src https://unpkg.com; img-src {{cspSource}} data: https:;">
    
    <!-- Base styles -->
    <link rel="stylesheet" href="{{baseStylesPath}}">
    <!-- Azure DevOps-specific styles -->
    <link rel="stylesheet" href="{{azureStylesPath}}">
    
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
    <!-- Global Overlay Spinner -->
    <div class="overlay-spinner" id="globalOverlaySpinner">
        <div class="overlay-spinner-content">
            <div class="overlay-spinner-icon"></div>
            <div class="overlay-spinner-title">Loading Pull Request</div>
            <div class="overlay-spinner-text">Fetching Azure DevOps pull request data...</div>
        </div>
    </div>

    <div class="container">
        <!-- Pull Request Header -->
        <div class="pr-header azure-header" id="prHeader">
            <div class="header-left">
                <div class="azure-pr-icon">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm7.5-6.923c-.67.204-1.335.82-1.887 1.855A7.97 7.97 0 0 0 5.145 4H7.5V1.077zM4.09 4a9.267 9.267 0 0 1 .64-1.539 6.7 6.7 0 0 1 .597-.933A7.025 7.025 0 0 0 2.255 4H4.09zm-.582 3.5c.03-.877.138-1.718.312-2.5H1.674a6.958 6.958 0 0 0-.656 2.5h2.49zM4.847 5a12.5 12.5 0 0 0-.338 2.5H7.5V5H4.847zM8.5 5v2.5h2.99a12.495 12.495 0 0 0-.337-2.5H8.5zM4.51 8.5a12.5 12.5 0 0 0 .337 2.5H7.5V8.5H4.51zm3.99 0V11h2.653c.187-.765.306-1.608.338-2.5H8.5zM5.145 12c.138.386.295.744.468 1.068.552 1.035 1.218 1.65 1.887 1.855V12H5.145zm.182 2.472a6.696 6.696 0 0 1-.597-.933A9.268 9.268 0 0 1 4.09 12H2.255a7.024 7.024 0 0 0 3.072 2.472zM3.82 11a13.652 13.652 0 0 1-.312-2.5h-2.49c.062.89.291 1.733.656 2.5H3.82zm6.853 3.472A7.024 7.024 0 0 0 13.745 12H11.91a9.27 9.27 0 0 1-.64 1.539 6.688 6.688 0 0 1-.597.933zM8.5 12v2.923c.67-.204 1.335-.82 1.887-1.855.173-.324.33-.682.468-1.068H8.5zm3.68-1h2.146c.365-.767.594-1.61.656-2.5h-2.49a13.65 13.65 0 0 1-.312 2.5zm2.802-3.5a6.959 6.959 0 0 0-.656-2.5H12.18c.174.782.282 1.623.312 2.5h2.49zM11.27 2.461c.247.464.462.98.64 1.539h1.835a7.024 7.024 0 0 0-3.072-2.472c.218.284.418.598.597.933zM10.855 4a7.966 7.966 0 0 0-.468-1.068C9.835 1.897 9.17 1.282 8.5 1.077V4h2.355z"/>
                    </svg>
                </div>
                <h1 class="pr-title" id="prTitleText">Loading...</h1>
            </div>
            <div class="header-right" id="headerActions">
                <button class="btn btn-secondary azure-btn">
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                    </svg>
                    Set auto-complete
                </button>
                <button class="btn btn-primary azure-btn">
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3v-3z"/>
                    </svg>
                    Approve
                    <span class="dropdown-arrow">▼</span>
                </button>
            </div>
        </div>

        <!-- PR Info Bar -->
        <div class="pr-info azure-info" id="prInfoBar">
            <span class="status-badge azure-status" id="statusBadge">Loading...</span>
            <span class="pr-id azure-pr-id" id="prIdDisplay">...</span>
            <span class="azure-merge-info" id="branchInfoDisplay">
                <span>Loading branch information...</span>
            </span>
            <div class="azure-policies" id="azurePolicies">
                <!-- Azure DevOps-specific policies will be populated here -->
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="nav-tabs azure-nav">
            <div class="nav-tab active" data-tab="overview">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z"/>
                    <path d="M3 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zM3 6a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 6zm0 2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/>
                </svg>
                Overview
            </div>
            <div class="nav-tab" data-tab="files" id="filesTabButton">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2l-3-3z"/>
                </svg>
                <span class="tab-text">Files</span>
                <span class="tab-badge azure-badge" id="filesBadge" style="display: none;"></span>
            </div>
            <div class="nav-tab" data-tab="commits" id="commitsTabButton">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1h-3zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M1 5h14v7.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V5z"/>
                </svg>
                <span class="tab-text">Commits</span>
                <span class="tab-badge azure-badge" id="commitsBadge" style="display: none;"></span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Tab Contents -->
            <div class="tab-contents">
                <!-- Overview Tab -->
                <div id="overviewTab" class="tab-content active">
                    <div class="azure-overview-layout">
                        <div class="azure-main-column">
                            <!-- Azure DevOps-specific overview content will be populated here -->
                            <div class="azure-description" id="azureDescription">
                                <!-- Description will be populated -->
                            </div>
                            
                            <!-- Azure DevOps Activity Feed -->
                            <div class="azure-activity" id="azureActivity">
                                <!-- Activity will be populated -->
                            </div>
                        </div>
                        
                        <div class="azure-sidebar">
                            <!-- Azure DevOps-specific sidebar content -->
                            <div id="azureSidebarContent">
                                <!-- Sidebar will be populated -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Files Tab -->
                <div id="filesTab" class="tab-content">
                    <div class="files-layout azure-files">
                        <div class="files-sidebar azure-files-sidebar" id="filesSidebar">
                            <div class="files-header">
                                <button class="collapse-sidebar-btn" onclick="toggleFilesSidebar()">
                                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                                    </svg>
                                </button>
                                <h4>Changed files</h4>
                            </div>
                            <div id="fileList" class="file-list">
                                <div class="form-help">Loading changed files...</div>
                            </div>
                        </div>
                        <div class="files-content azure-diff-content">
                            <div id="diffPreview" class="diff-preview">
                                <div class="form-help">Select a file to view changes</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Commits Tab -->
                <div id="commitsTab" class="tab-content">
                    <div class="commits-container azure-commits">
                        <div class="commits-header">
                            <h3>
                                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1h-3zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5z"/>
                                    <path d="M1 5h14v7.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V5z"/>
                                </svg>
                                Commits
                            </h3>
                            <div class="commits-count azure-commits-count" id="commitsCount">Loading...</div>
                        </div>
                        <div class="commits-list azure-commits-list" id="commitsList">
                            <div class="loading">
                                <div class="loading-content">
                                    <div class="loading-spinner"></div>
                                    <div class="loading-text">Loading commits...</div>
                                    <div class="loading-subtext">Fetching Azure DevOps commit history</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Base JavaScript -->
    <script src="{{baseJsPath}}"></script>
    <!-- Azure DevOps-specific JavaScript -->
    <script src="{{azureJsPath}}"></script>
</body>
</html>
