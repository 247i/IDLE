<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src vscode-resource: 'unsafe-inline'; script-src vscode-resource: 'unsafe-inline'; img-src vscode-resource: data:;">
    <title>Run Settings</title>
    <link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
    <div class="container">
        <!-- No .runsettings files detected -->
        <div id="noRunSettingsSection" class="no-runsettings-section" style="display: none;">
            <div class="no-runsettings-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <polyline points="10,9 9,9 8,9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h3>No .runsettings Files Found</h3>
            <p>No .runsettings files were detected in your solution or test projects.</p>
            <button class="button button-primary" id="refreshBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Refresh
            </button>
        </div>

        <!-- Single .runsettings file detected -->
        <div id="singleRunSettingsSection" class="single-runsettings-section" style="display: none;">
            <div class="runsettings-item selected">
                <button class="button button-icon runsettings-icon-button" id="singleOpenBtn" title="Open file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="runsettings-info">
                    <div class="runsettings-name" id="singleRunSettingsName">.runsettings</div>
                    <div class="runsettings-description" id="singleRunSettingsDescription">Found in solution root folder</div>
                </div>
            </div>
        </div>

        <!-- Multiple .runsettings files detected -->
        <div id="multipleRunSettingsSection" class="multiple-runsettings-section" style="display: none;">
            <div class="section-header">
                <h4>Select .runsettings File</h4>
                <p>Multiple .runsettings files detected. Choose which one to use for test execution:</p>
            </div>
            
            <div class="dropdown-container">
                <select id="runSettingsDropdown" class="dropdown">
                    <!-- Options will be populated by JavaScript -->
                </select>
                <button class="button button-icon" id="multipleOpenBtn" title="Open selected file">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>
