<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src %CSP_SOURCE% 'unsafe-inline'; script-src %CSP_SOURCE% 'unsafe-inline';">
    <link rel="stylesheet" href="%STYLES_URI%">
    <title>%TOOL_TITLE%</title>
    <script>
        window.toolType = '%TOOL_TYPE%';
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="tool-title">%TOOL_TITLE%</h1>
            <button id="clearBtn" class="secondary-button">Clear All</button>
        </div>
        
        <div id="mainContainer" class="main-content">
            <!-- Tool content will be rendered here by JavaScript -->
        </div>
    </div>
    
    <script src="%SCRIPT_URI%"></script>
</body>
</html>
